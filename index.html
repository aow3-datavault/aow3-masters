<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1015">
  <meta name="description" content="Локальное интерактивное превью турнира Art of War Masters.">
  <title>Art of War Masters — турнирное превью</title>
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-view="overview" aria-label="Art of War Masters — обзор">
        <span class="brand-mark"><span>A</span><i>W</i></span>
        <span class="brand-copy"><strong>ART OF WAR</strong><small>MASTERS SERIES</small></span>
      </a>
      <div class="season-tag"><span class="pulse-dot"></span> ПРОТОКОЛ · 32 СЛОТА</div>
      <div class="nav-label">ТУРНИР</div>
      <nav class="primary-nav" aria-label="Разделы турнира">
        <button class="nav-item active" type="button" data-view="overview"><span class="nav-symbol">◈</span><span>Обзор</span><span class="nav-arrow">↗</span></button>
        <button class="nav-item" type="button" data-view="cabinet"><span class="nav-symbol">⌂</span><span>Моё участие</span></button>
        <button class="nav-item" type="button" data-view="players"><span class="nav-symbol">◎</span><span>Участники</span></button>
        <button class="nav-item" type="button" data-view="bracket"><span class="nav-symbol">⌘</span><span>Сетка</span></button>
        <button class="nav-item" type="button" data-view="streams"><span class="nav-symbol">▷</span><span>Трансляции</span></button>
        <button class="nav-item" type="button" data-view="clans"><span class="nav-symbol">⬡</span><span>Кланы</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="nav-label">ОРГАНИЗАЦИЯ</div>
        <button class="nav-item organizer-link" type="button" data-view="admin"><span class="nav-symbol">▤</span><span>Приглашения</span><span class="demo-chip">ДЕМО</span></button>
        <div class="sidebar-separator"></div>
        <button class="reset-link" type="button" data-action="reset-demo"><span>↻</span> Сбросить демо-данные</button>
        <div class="sidebar-foot"><span class="pulse-dot"></span> Локальное превью <span>v.01</span></div>
      </div>
    </aside>
    <div class="mobile-shade" data-action="close-menu"></div>
    <div class="main-column">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-trigger" type="button" data-action="toggle-menu" aria-label="Открыть меню" aria-expanded="false">☰</button>
          <div class="breadcrumb"><span>MASTERS</span><b>/</b><strong id="breadcrumb-current">ОБЗОР</strong></div>
        </div>
        <div class="topbar-right">
          <span class="topbar-season"><i></i> СЕЗОН · PREVIEW</span>
          <button id="language-switch" class="language-switch" type="button" data-action="toggle-language" aria-label="Switch to English">EN</button>
          <button class="user-pill" type="button" data-action="open-auth"><span class="user-avatar">?</span><span id="user-pill-label">Гость</span><b>⌄</b></button>
        </div>
      </header>
      <main class="page" id="main-content" tabindex="-1"></main>
    </div>
  </div>
  <dialog class="app-modal" id="app-modal" aria-labelledby="modal-title">
    <div class="modal-inner" id="modal-content"></div>
  </dialog>
  <script src="summer-data.js"></script>
  <script src="i18n.js?v=5"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
